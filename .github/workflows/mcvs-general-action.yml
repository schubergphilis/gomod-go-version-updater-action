---
name: general
"on": pull_request
permissions:
  contents: read
  packages: read
jobs:
  mcvs-general-action:
    strategy:
      matrix:
        args:
          - testing-type: lint-action
          - testing-type: lint-commit
          - testing-type: lint-git
          - testing-type: yamllint
    # lint-action runs zizmor in Docker, which ubuntu-slim does not have.
    runs-on: >-
      ${{ matrix.args.testing-type == 'lint-action' && 'ubuntu-26.04' ||
      'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable rule:line-length
      - uses: schubergphilis/mcvs-general-action@96298a5c109d08a0dfd9047963e01e2441421a3f # v0.11.1
        with:
          testing-type: ${{ matrix.args.testing-type }}
